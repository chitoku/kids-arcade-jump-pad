[platformio]
default_envs = atoms3

[env:atoms3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_eol = LF
monitor_echo = no
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@0.2.7
    m5stack/M5GFX@0.2.29

; Diagnostic-only build: no HID descriptor or key reports.
[env:atoms3-serial]
extends = env:atoms3
build_flags =
    ${env:atoms3.build_flags}
    -DJUMP_PAD_HID=0
